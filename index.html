<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彩虹拉力队 Rainbow Rally · 横屏亲子赛车</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div id="hearts" class="pill"></div>
      <div id="coins" class="pill">🪙 0</div>
      <div id="cans" class="pill"></div>
      <div class="spacer"></div>
      <button id="btnMute" class="round-btn">🔊</button>
      <button id="btnPause" class="round-btn">⏸</button>
    </div>
    <div class="hud-bottom">
      <div class="energy-wrap"><div id="energy"></div></div>
      <div class="progress-wrap">
        <div id="progress"></div>
        <span class="progress-flag">🏁</span>
      </div>
    </div>
  </div>

  <!-- 触屏按钮 -->
  <div id="touch" class="hidden">
    <button id="btnBoost" class="touch-btn boost">⚡<i>氮气</i></button>
    <button id="btnJump" class="touch-btn jump">⬆<i>跳跃</i></button>
  </div>

  <!-- 主菜单 -->
  <div id="menu" class="screen">
    <div class="card menu-card">
      <div class="logo">🌈 彩虹拉力队</div>
      <div class="sub">Rainbow Rally · 把颜色开回家！</div>
      <div id="diffRow">
        <button class="diff-btn" data-k="family"><b>🍼 亲子护航</b><span>护盾常开 · 障碍稀疏</span></button>
        <button class="diff-btn" data-k="normal"><b>🌈 标准速度</b><span>难度适中 · 推荐</span></button>
        <button class="diff-btn" data-k="expert"><b>⚡ 专家冲刺</b><span>障碍密集 · 币 +50%</span></button>
      </div>
      <button id="btnStart" class="big-btn">🚗 出发！</button>
      <div class="help">
        ⬆️⬇️ / 拖动屏幕 = 上下移动　·　空格 = 跳跃（长按跳更高）　·　Shift = 氮气　·　P 暂停　·　M 静音<br>
        跳过灰灰喵的头顶就能治愈它 · 撞到障碍只掉一颗心，永远不会真的输哦
      </div>
      <div id="menuBest" class="best"></div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="result" class="screen hidden">
    <div class="card result-card">
      <div id="resStar">S</div>
      <div id="resTitle">小站点亮！</div>
      <div id="resMsg"></div>
      <div id="resStats"></div>
      <div class="row">
        <button id="btnAgain" class="big-btn">🔁 再跑一次</button>
        <button id="btnMenu" class="mid-btn">🏠 回车库</button>
      </div>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="pause" class="screen hidden">
    <div class="card pause-card">
      <div class="logo small">⏸ 暂停中</div>
      <div class="row">
        <button id="btnResume" class="big-btn">▶ 继续</button>
        <button id="btnRetry" class="mid-btn">🔁 重来</button>
        <button id="btnQuit" class="mid-btn">🏠 回车库</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- 竖屏提示 -->
  <div id="rotate"><div>🔄<br>请把手机横过来<br><small>彩虹拉力队要横着开！</small></div></div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/track.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
